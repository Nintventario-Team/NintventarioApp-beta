name: Flutter Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.1'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install ninja-build cmake clang libgtk-3-dev
        sudo apt-get install -y openjdk-8-jdk wget unzip
        wget "https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip" -O android-sdk.zip
        unzip android-sdk.zip -d android-sdk-linux
        echo "y" | android-sdk-linux/tools/bin/sdkmanager "platform-tools" "platforms;android-29" "system-images;android-29;default;x86_64"
        echo "no" | android-sdk-linux/tools/bin/avdmanager create avd -n test -k "system-images;android-29;default;x86_64" --force
        android-sdk-linux/emulator/emulator -avd test -no-audio -no-window &

    - name: Get dependencies
      run: flutter pub get

    - name: Run tests
      run: flutter test

    - name: Run all integration tests on Android Emulator
      run: flutter drive -d emulator-5554
