name: Flutter Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.1'

    - name: Get dependencies
      run: flutter pub get

    - name: Install dependencies for Linux
      run: |
        sudo apt-get update
        sudo apt-get install ninja-build cmake clang libgtk-3-dev

    - name: Run tests
      run: flutter test

